name: Deploy ChinaBench-T2I Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build viewer data
        run: node scripts/build-viewer-data.mjs
      - name: Validate viewer data
        run: node scripts/validate-viewer.mjs web/data/cases-v0.1.json
      - name: Run viewer tests
        run: node --test tests/*.test.mjs
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site/web _site/benchmark/v0.1 _site/results/chatgpt-image
          cp -r web/results _site/web/results
          cp -r web/data _site/web/data
          cp -r web/js _site/web/js
          cp -r web/css _site/web/css
          if [ -d web/assets ]; then cp -r web/assets _site/web/assets; fi
          if [ -d web/svg ]; then cp -r web/svg _site/web/svg; fi
          if [ -f web/index.html ]; then cp web/index.html _site/web/index.html; fi
          cp benchmark/v0.1/questions.json _site/benchmark/v0.1/questions.json
          cp benchmark/v0.1/anchors.json _site/benchmark/v0.1/anchors.json
          cp results/chatgpt-image/run-2026-10-06.json _site/results/chatgpt-image/run-2026-10-06.json
          cp index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
