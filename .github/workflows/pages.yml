name: Deploy ChinaBench to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build public site
        shell: bash
        run: |
          mkdir -p _site/web _site/benchmark/v0.1
          cp web/index.html _site/web/index.html
          cp -r web/results _site/web/results
          cp -r web/assets _site/web/assets
          cp benchmark/v0.1/questions.json _site/benchmark/v0.1/questions.json
          cp benchmark/v0.1/anchors.json _site/benchmark/v0.1/anchors.json
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
