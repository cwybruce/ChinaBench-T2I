name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate viewer data
        run: node scripts/validate-viewer.mjs web/data/cases-v0.1.json
      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/web
          cp web/index.html _site/web/index.html 2>/dev/null || true
          cp -r web/results _site/web/results
          cp -r web/data _site/web/data
          cp -r web/js _site/web/js
          cp -r web/css _site/web/css
          if [ -d web/svg ]; then cp -r web/svg _site/web/svg; fi
          if [ -d web/assets ]; then cp -r web/assets _site/web/assets; fi
          cp index.html _site/index.html 2>/dev/null || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
