name: Validate and deploy Pages

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run viewer tests
        run: node --test tests/*.test.mjs
      - name: Build derived viewer data
        run: node scripts/build-viewer-data.mjs
      - name: Validate derived viewer data
        run: node scripts/validate-viewer.mjs web/data/cases-v0.1.json

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build viewer data
        run: node scripts/build-viewer-data.mjs
      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site/results/chatgpt-image
          cp index.html _site/index.html
          cp -r web _site/web
          cp -r benchmark _site/benchmark
          cp results/chatgpt-image/run-2026-10-06.json _site/results/chatgpt-image/run-2026-10-06.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
