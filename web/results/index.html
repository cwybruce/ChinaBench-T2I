<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ChinaBench-T2I V0.1 · Results</title>
  <link rel="stylesheet" href="../css/eval-viewer.css">
</head>
<body class="results-page">
  <main class="app-shell">
    <header class="results-hero">
      <div>
        <p class="eyebrow">CHINABENCH-T2I · V0.1</p>
        <h1>Explainable T2I Evaluation</h1>
        <p class="hero-copy">30 道中文文化组合能力测试。每题显示 Prompt、HTML/SVG 规格图、原子条件、依赖关系，以及真实模型输出状态。</p>
      </div>
      <div class="hero-metrics">
        <div><strong id="metricGenerated">—</strong><span>已生成</span></div>
        <div><strong id="metricReviewed">—</strong><span>已复核</span></div>
        <div><strong>30</strong><span>总测试</span></div>
      </div>
    </header>

    <section class="filter-bar card" aria-label="Results filters">
      <label>Suite<select id="filterSuite"><option value="all">全部</option><option value="core">Core</option><option value="anchor">Anchor</option></select></label>
      <label>Capability<select id="filterCapability"><option value="all">全部</option><option>C1</option><option>C2</option><option>C3</option><option>C4</option><option>C5</option><option>C6</option><option>C7</option><option>C8</option></select></label>
      <label>Zodiac<select id="filterZodiac"><option value="all">全部</option></select></label>
      <label>Difficulty<select id="filterDifficulty"><option value="all">全部</option><option value="2">L2</option><option value="3">L3</option><option value="4">L4</option><option value="5">L5</option></select></label>
      <button id="clearFilters">清除筛选</button>
    </section>

    <section id="resultsError" class="error-panel" hidden></section>
    <section id="resultsGrid" class="results-grid" aria-live="polite"></section>
  </main>
  <script type="module" src="../js/results-index.js"></script>
</body>
</html>
