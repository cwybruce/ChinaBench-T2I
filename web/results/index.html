<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChinaBench-T2I Results</title><link rel="stylesheet" href="../css/eval-viewer.css"><style>.overview{max-width:1480px;margin:auto;padding:22px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filters select{background:#0d1217;color:#e9eef2;border:1px solid #26313b;border-radius:9px;padding:8px}.case-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.case-card{display:block;background:#10161c;border:1px solid #26313b;border-radius:14px;padding:15px;color:#f4f7f9;text-decoration:none}.case-card p{color:#8e9aa7;line-height:1.55;font-size:12px}.case-card footer{display:flex;justify-content:space-between}.pending{color:#ffc857}.reviewed{color:#24d18d}@media(max-width:900px){.case-grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.case-grid{grid-template-columns:1fr}}</style></head><body><main class="overview"><h1>ChinaBench-T2I V0.1</h1><p>Prompt → Atomic Checks → Dependency DAG → SVG Spec → Model Output</p><div class="filters"><select data-filter="suite"><option value="">全部套件</option><option value="core">Core</option><option value="anchor">Anchor</option></select><select data-filter="capability"><option value="">全部能力</option><option>C1</option><option>C2</option><option>C3</option><option>C4</option><option>C5</option><option>C6</option><option>C7</option><option>C8</option></select><select data-filter="zodiac"><option value="">全部生肖</option></select><select data-filter="difficulty"><option value="">全部难度</option><option value="1">L1</option><option value="2">L2</option><option value="3">L3</option><option value="4">L4</option><option value="5">L5</option></select></div><section class="case-grid" data-case-grid></section></main><script type="module">const data=await fetch('../data/cases-v0.1.json').then(r=>r.json()),cases=data.cases||[],grid=document.querySelector('[data-case-grid]'),ss=[...document.querySelectorAll('[data-filter]')],z=document.querySelector('[data-filter="zodiac"]');[...new Set(cases.map(c=>c.zodiac).filter(Boolean))].forEach(v=>z.insertAdjacentHTML('beforeend','<option value="'+v+'">'+v+'</option>'));function render(){const f=Object.fromEntries(ss.map(s=>[s.dataset.filter,s.value])),shown=cases.filter(c=>(!f.suite||c.suite===f.suite)&&(!f.capability||c.capabilities.includes(f.capability))&&(!f.zodiac||c.zodiac===f.zodiac)&&(!f.difficulty||String(c.difficulty)===f.difficulty));grid.innerHTML=shown.map(c=>{const rev=c.result?.status==='reviewed',status=rev?Number(c.result.total_score).toFixed(1)+' / 10':(c.result?.status==='generated_pending_review'?'已生成 · 待复核':'待生成');return '<a class="case-card" href="case.html?id='+c.id+'"><b>'+c.id+' · '+c.title+'</b><p>'+c.prompt+'</p><footer><span>'+c.capabilities.join(' · ')+'</span><span class="'+(rev?'reviewed':'pending')+'">'+status+'</span></footer></a>'}).join('')}ss.forEach(s=>s.addEventListener('change',render));render();</script></body></html>
