<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChinaBench-T2I Results</title><link rel="stylesheet" href="../css/eval-viewer.css"><style>.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.case-card{display:block;color:inherit;text-decoration:none;padding:14px}.case-meta{display:flex;justify-content:space-between;font-size:11px}.pending{color:var(--amber)}.reviewed{color:var(--green)}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:600px){.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><div class="muted">ChinaBench-T2I V0.1</div><h1>Explainable Results</h1><p class="muted">30 cases · HTML/SVG spec view · atomic dependency evaluation</p></div></div><div class="filters"><select id="suite-filter"><option value="">全部 Suite</option><option value="core">Core</option><option value="anchor">Anchor</option></select><select id="capability-filter"><option value="">全部能力</option><option>C1</option><option>C2</option><option>C3</option><option>C4</option><option>C5</option><option>C6</option><option>C7</option><option>C8</option></select><select id="zodiac-filter"><option value="">全部生肖</option></select><select id="difficulty-filter"><option value="">全部难度</option><option value="1">L1</option><option value="2">L2</option><option value="3">L3</option><option value="4">L4</option><option value="5">L5</option></select></div><div id="summary" class="muted"></div><div id="cards" class="cards"></div></div><script type="module">const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const r=await fetch('../data/cases-v0.1.json',{cache:'no-store'}),cases=await r.json();const z=[...new Set(cases.map(x=>x.zodiac).filter(Boolean))];document.querySelector('#zodiac-filter').insertAdjacentHTML('beforeend',z.map(x=>`<option>${esc(x)}</option>`).join(''));['suite-filter','capability-filter','zodiac-filter','difficulty-filter'].forEach(id=>document.querySelector('#'+id).onchange=render);function render(){const s=document.querySelector('#suite-filter').value,c=document.querySelector('#capability-filter').value,z=document.querySelector('#zodiac-filter').value,d=document.querySelector('#difficulty-filter').value,l=cases.filter(x=>(!s||x.suite===s)&&(!c||x.capabilities.includes(c))&&(!z||x.zodiac===z)&&(!d||String(x.difficulty)===d));document.querySelector('#summary').textContent=`显示 ${l.length} / ${cases.length}`;document.querySelector('#cards').innerHTML=l.map(x=>`<a class="card case-card" href="case.html?id=${encodeURIComponent(x.id)}"><div class="case-meta"><span>${esc(x.id)} · ${esc(x.zodiac||'')}</span><span class="${x.result?.state==='reviewed'?'reviewed':'pending'}">${x.result?.state==='reviewed'?(Number(x.result.total_score).toFixed(1)+' / 10'):(x.result?.result_image?'已生成 · 待复核':'待生成')}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.prompt).slice(0,88)}${x.prompt.length>88?'…':''}</p><div class="case-meta"><span>${x.capabilities.map(esc).join(' · ')}</span><span>L${esc(x.difficulty)}</span></div></a>`).join('')}render();</script></body></html>
